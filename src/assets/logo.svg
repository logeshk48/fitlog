<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 85 520 130">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="lg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A24"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
  </defs>

  <!-- outer glow -->
  <rect x="90" y="88" width="500" height="124" rx="62" fill="none" stroke="#FF6B6B" stroke-width="14" opacity="0.07"/>
  <rect x="96" y="94" width="488" height="112" rx="56" fill="none" stroke="#FF6B6B" stroke-width="6" opacity="0.1"/>

  <!-- main pill -->
  <rect x="102" y="100" width="476" height="100" rx="50" fill="url(#card)" stroke="url(#lg1)" stroke-width="2.5"/>

  <!-- inner ring -->
  <rect x="114" y="112" width="452" height="76" rx="38" fill="none" stroke="rgba(255,107,107,0.08)" stroke-width="1"/>

  <!-- F mark -->
  <rect x="130" y="122" width="9" height="56" rx="4.5" fill="url(#lg1)"/>
  <rect x="130" y="122" width="38" height="12" rx="6" fill="url(#lg1)"/>
  <rect x="130" y="141" width="28" height="11" rx="5.5" fill="url(#lg2)"/>

  <!-- separator -->
  <line x1="192" y1="114" x2="192" y2="186" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- FITLOG text -->
  <text x="345" y="162" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">FITLOG</text>

  <!-- neon underline -->
  <rect x="215" y="172" width="180" height="2.5" rx="1.25" fill="url(#lg3)"/>

  <!-- tagline -->
  <text x="345" y="190" font-family="Arial, sans-serif" font-size="7.5" fill="#505068" text-anchor="middle" letter-spacing="4.5" font-weight="700">TRACK · ANALYZE · DOMINATE</text>

  <!-- right dots -->
  <circle cx="516" cy="126" r="5" fill="#FF6B6B"/>
  <circle cx="530" cy="150" r="4" fill="#4ECDC4"/>
  <circle cx="516" cy="174" r="5" fill="#FFE66D"/>
  <circle cx="504" cy="114" r="3" fill="#A855F7" opacity="0.7"/>
  <circle cx="504" cy="186" r="3" fill="#FF8E53" opacity="0.7"/>
  <circle cx="542" cy="136" r="2.5" fill="#4ECDC4" opacity="0.4"/>
  <circle cx="542" cy="164" r="2.5" fill="#FF6B6B" opacity="0.4"/>
  <circle cx="340" cy="100" r="3" fill="#FF6B6B" opacity="0.4"/>
</svg>